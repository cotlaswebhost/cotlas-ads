name: Build plugin release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable ZIP
        run: |
          mkdir -p build/cotlas-ads
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' --exclude='.DS_Store' ./ build/cotlas-ads/
          cd build
          zip -qr cotlas-ads.zip cotlas-ads
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/cotlas-ads.zip
          generate_release_notes: true
